
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카테고리 페이지</title>

    <link rel="stylesheet" href="css/list.css">
</head>

<body>

    <div class="mobile-container">

        <!-- 최상단 띠 배너 -->
        <div class="top-banner">
            혜택 안내
        </div>

        <!-- 상단 헤더 -->
        <header class="header">

            <button class="back-btn" type="button" aria-label="뒤로가기"
                onclick="history.back()">
                <svg width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="#111111" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>

            <h1 class="page-title">카테고리명</h1>

            <!-- 햄버거 버튼 -->
            <button class="menu-btn" id="menuBtn"
                    type="button"
                    aria-label="메뉴 열기"
                    aria-expanded="false">

                <svg width="26" height="26" viewBox="0 0 24 24"
                     fill="none" stroke="#111111" stroke-width="2"
                     stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>

            </button>

        </header>


        <!-- 카테고리 탭 -->
        <nav class="category-tabs">
            <a href="#" class="category-tab">카테고리</a>
            <a href="#" class="category-tab">카테고리</a>
            <a href="#" class="category-tab">카테고리</a>
            <a href="#" class="category-tab">카테고리</a>
        </nav>


        <!-- 메인 배너 -->
        <section class="hero-banner"></section>


        <!-- 베스트 물품 -->
        <section class="best-section">

            <h2 class="section-title">베스트 물품</h2>

            <div class="best-grid">

                <div class="best-item">
                    <div class="best-thumb"></div>
                    <span class="product-name">제품명</span>
                </div>

                <div class="best-item">
                    <div class="best-thumb"></div>
                    <span class="product-name">제품명</span>
                </div>

                <div class="best-item">
                    <div class="best-thumb"></div>
                    <span class="product-name">제품명</span>
                </div>

                <div class="best-item">
                    <div class="best-thumb"></div>
                    <span class="product-name">제품명</span>
                </div>

                <div class="best-item">
                    <div class="best-thumb"></div>
                    <span class="product-name">제품명</span>
                </div>

            </div>

        </section>


        <!-- 하단 제품 리스트 -->
        <section class="list-section">

            <div class="product-list">

                <div class="list-item">
                    <div class="list-thumb"></div>
                    <div class="list-info">
                        <span class="product-name">제품명</span>
                    </div>
                </div>

                <div class="list-item">
                    <div class="list-thumb"></div>
                    <div class="list-info">
                        <span class="product-name">제품명</span>
                    </div>
                </div>

                <div class="list-item">
                    <div class="list-thumb"></div>
                    <div class="list-info">
                        <span class="product-name">제품명</span>
                    </div>
                </div>

            </div>

            <!-- 페이지네이션 -->
            <div class="pagination">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

        </section>


        <!-- 하단 여백 -->
        <div class="bottom-space"></div>

    </div>


    <!-- 메뉴 배경 오버레이 -->
    <div class="menu-overlay" id="menuOverlay"></div>


    <!-- 오른쪽 슬라이드 메뉴 -->
    <nav class="side-menu" id="sideMenu">

        <div class="side-menu-header">

            <h2>MENU</h2>

            <!-- 메뉴 내부 검색창 -->
            <div class="side-menu-search">

                <input type="text" placeholder="검색어 입력"
                       aria-label="검색어 입력">

                <svg width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
                </svg>

            </div>

        </div>


        <!-- 메뉴 페이지 이동 -->
        <ul class="side-menu-list">

            <li>
                <a href="../../index.html">메인 페이지</a>
            </li>

            <li>
                <a href="list.html">리스트 페이지</a>
            </li>

            <li>
                <a href="../details/details.html">상세 페이지</a>
            </li>

            <li>
                <a href="../payments/payments.html">결제 페이지</a>
            </li>

        </ul>

    </nav>


    <!-- 햄버거 메뉴 동작 -->
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');

        // 메뉴 열기 / 닫기
        menuBtn.addEventListener('click', function () {

            const isOpen = sideMenu.classList.toggle('active');

            menuOverlay.classList.toggle('active');

            menuBtn.setAttribute('aria-expanded', isOpen);

        });

        // 배경 클릭 시 메뉴 닫기
        menuOverlay.addEventListener('click', function () {

            sideMenu.classList.remove('active');
            menuOverlay.classList.remove('active');

            menuBtn.setAttribute('aria-expanded', 'false');

        });
    </script>

</body>
</html>
