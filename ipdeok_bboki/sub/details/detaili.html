<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 기존 스타일시트 유지 -->
    <link rel="stylesheet" href="css/detalis.css">
    
    <!-- 추가된 모바일 페이지 전용 스타일 (기존 .page-navigation과 충돌하지 않도록 격리) -->
    <style>
        /* 모바일 컨테이너 내부 요소에만 초기화 및 폰트 적용 */
        .mobile-container,
        .mobile-container * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }

        /* 모바일 뷰포트 컨테이너 (기존 nav 아래 중앙 정렬) */
        .mobile-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }

        /* 1. 최상단 띠 배너 */
        .mobile-container .top-banner {
            background-color: #7d7d7d;
            color: #ffffff;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            padding: 5px 0;
        }

        /* 2. 헤더 영역 */
        .mobile-container .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #ffffff;
        }

        .mobile-container .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            padding: 0;
        }

        .mobile-container .page-title {
            font-size: 18px;
            font-weight: 700;
            color: #111111;
            margin: 0 0 0 24px;
        }

        .mobile-container .search-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            background-color: #d9d9d9;
            border-radius: 15px;
            width: 105px;
            height: 24px;
            padding: 0 8px;
        }

        .mobile-container .search-bar input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 12px;
            padding-right: 4px;
        }

        .mobile-container .search-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            cursor: pointer;
        }

        /* 3. 카테고리 탭 메뉴 */
        .mobile-container .category-tabs {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 14px;
            background-color: #ffffff;
        }

        .mobile-container .category-tab {
            font-size: 14px;
            font-weight: 700;
            color: #111111;
            text-decoration: none;
        }

        /* 4. 메인 배너 영역 */
        .mobile-container .hero-banner {
            width: 100%;
            height: 290px;
            background-color: #787878;
        }

        /* 5. 베스트 물품 섹션 */
        .mobile-container .best-section {
            background-color: #d9d9d9;
            margin-top: 22px;
            padding: 16px 20px 24px;
        }

        .mobile-container .section-title {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #111111;
            margin: 0 0 14px 0;
        }

        .mobile-container .best-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

   .mobile-container .best-item {
    display: flex;
    flex-direction: column;
}
