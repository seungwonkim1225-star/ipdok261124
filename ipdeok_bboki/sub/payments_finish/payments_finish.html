
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>입떡볶이 - 결제 완료</title>

    <link rel="stylesheet" href="css/payments.css">
</head>
<body>

<div class="finish-wrap">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="finish-header">

        <h1>결제 완료</h1>

        <a href="../../index.html" class="close-btn">
            ×
        </a>

    </header>


    <!-- =========================
         결제 완료 안내
    ========================== -->

    <section class="success-section">

        <div class="success-icon">✓</div>

        <h2>주문이 완료되었습니다!</h2>

        <p>입덕할 만큼 맛있는 입떡볶이</p>

    </section>


    <!-- =========================
         주문 정보
    ========================== -->

    <section class="finish-card">

        <h2 class="card-title">주문 정보</h2>

        <div class="info-row">
            <span>주문번호</span>
            <strong>20261125-0001</strong>
        </div>

        <div class="product-box">

            <div class="product-image"></div>

            <div class="product-info">
                <h3>로제 떡볶이</h3>
                <p>기본맛 · 1인분</p>
                <strong>12,000원</strong>
            </div>

        </div>

    </section>


    <!-- =========================
         스탬프 쿠폰
    ========================== -->

    <section class="finish-card stamp-card">

        <div class="stamp-header">

            <h2 class="card-title">
                입떡볶이 스탬프 쿠폰
            </h2>

            <strong class="stamp-count" id="stampCount">
                1 / 10
            </strong>

        </div>

        <p class="stamp-description">
            스탬프 10개를 모아 특별한 혜택을 받아보세요!
        </p>

        <!-- 떡볶이 캐릭터 10개 -->
        <div class="stamp-grid" id="stampGrid"></div>

        <!-- 적립 진행바 -->
        <div class="stamp-progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p class="stamp-message" id="stampMessage">
            혜택까지 9개 남았어요!
        </p>

    </section>


    <!-- =========================
         결제 정보
    ========================== -->

    <section class="finish-card">

        <h2 class="card-title">결제 정보</h2>

        <div class="info-row">
            <span>상품 금액</span>
            <strong>12,000원</strong>
        </div>

        <div class="info-row">
            <span>배달비</span>
            <strong>3,000원</strong>
        </div>

        <div class="info-row">
            <span>할인 금액</span>
            <strong>0원</strong>
        </div>

        <div class="line"></div>

        <div class="info-row">
            <span>결제 수단</span>
            <strong>신용 / 체크카드</strong>
        </div>

        <div class="info-row">
            <span>결제 일시</span>
            <strong id="paymentDate"></strong>
        </div>

        <div class="total-price">

            <span>총 결제 금액</span>

            <strong>15,000원</strong>

        </div>

    </section>


    <!-- =========================
         페이지 이동 버튼
    ========================== -->

    <footer class="finish-footer">

        <a href="../../index.html" class="home-btn">
            메인으로 돌아가기
        </a>

        <a href="../list/list.html" class="list-btn">
            메뉴 더 둘러보기
        </a>

    </footer>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script>

    const MAX_STAMPS = 10;

    // 결제 페이지에서 전달된 주문 확인
    const params = new URLSearchParams(location.search);
    const orderId = params.get('order');

    let stampCount = Number(
        localStorage.getItem('ipdeokStamp') || 0
    );

    // 동일한 주문의 중복 적립 방지
    if (orderId) {

        const orderKey = 'ipdeokOrder_' + orderId;

        if (!localStorage.getItem(orderKey)) {

            stampCount = Math.min(
                stampCount + 1,
                MAX_STAMPS
            );

            localStorage.setItem(
                'ipdeokStamp',
                stampCount
            );

            localStorage.setItem(orderKey, 'true');

        }

    }

    const stampGrid = document.getElementById('stampGrid');

    // 떡볶이 캐릭터 10개 생성
    for (let i = 0; i < MAX_STAMPS; i++) {

        const stamp = document.createElement('div');

        stamp.className = 'stamp-item';

        if (i < stampCount) {
            stamp.classList.add('filled');
        }

        stamp.innerHTML = `

            <svg viewBox="0 0 64 64">

                <circle
                    class="stamp-circle"
                    cx="32"
                    cy="32"
                    r="29"
                />

                <g transform="rotate(-12 32 32)">

                    <!-- 떡볶이 몸통 -->
                    <rect
                        class="rice-cake"
                        x="18"
                        y="9"
                        width="28"
                        height="46"
                        rx="14"
                    />

                    <!-- 눈 -->
                    <circle
                        class="face"
                        cx="27"
                        cy="28"
                        r="2"
                    />

                    <circle
                        class="face"
                        cx="37"
                        cy="28"
                        r="2"
                    />

                    <!-- 입 -->
                    <path
                        class="smile"
                        d="M28 34 Q32 40 36 34"
                    />

                    <!-- 볼 -->
                    <ellipse
                        class="cheek"
                        cx="23"
                        cy="34"
                        rx="3"
                        ry="2"
                    />

                    <ellipse
                        class="cheek"
                        cx="41"
                        cy="34"
                        rx="3"
                        ry="2"
                    />

                </g>

            </svg>

            <span>${i + 1}</span>

        `;

        stampGrid.appendChild(stamp);

    }


    // 스탬프 개수 표시
    document.getElementById('stampCount').textContent =
        stampCount + ' / ' + MAX_STAMPS;


    // 진행바 표시
    document.getElementById('progressBar').style.width =
        (stampCount / MAX_STAMPS * 100) + '%';


    // 적립 안내 문구
    const remaining = MAX_STAMPS - stampCount;

    document.getElementById('stampMessage').textContent =
        remaining === 0
        ? '스탬프 적립 완료! 혜택을 받아보세요.'
        : '혜택까지 ' + remaining + '개 남았어요!';


    // 결제 일시 표시
    const paymentTime = orderId && /^\d+$/.test(orderId)
        ? new Date(Number(orderId))
        : new Date();

    document.getElementById('paymentDate').textContent =
        paymentTime.toLocaleString('ko-KR');

</script>

</body>
</html>
