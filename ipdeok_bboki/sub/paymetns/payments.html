
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입떡볶이 - 결제하기</title>
   <link rel="stylesheet" href="css/payments.css">
</head>
<body>

<div class="payment-wrap">

    <!-- 헤더 -->
    <header class="payment-header">
        <a href="../details/details.html" class="back-btn">←</a>
        <h1>주문 / 결제</h1>
    </header>

    <!-- 주문 상품 -->
    <section class="payment-section product-section">
        <h2>주문 상품</h2>

        <div class="product-card">
            <div class="product-image"></div>

            <div class="product-info">
                <span class="product-category">입떡볶이 인기 메뉴</span>
                <h3>로제 떡볶이</h3>
                <p>기본맛 · 1인분</p>
                <strong class="product-price">12,000원</strong>
            </div>
        </div>
    </section>

    <!-- 배달 정보 -->
    <section class="payment-section">
        <h2>배달 정보</h2>

        <div class="info-row">
            <span>받는 사람</span>
            <strong>홍길동</strong>
        </div>

        <div class="info-row">
            <span>연락처</span>
            <strong>010-0000-0000</strong>
        </div>

        <div class="info-row address-row">
            <span>배달 주소</span>
            <strong>인천광역시 ○○구 ○○로 00</strong>
        </div>

        <div class="delivery-request">
            <label for="request">배달 요청사항</label>
            <select id="request">
                <option>요청사항을 선택해주세요.</option>
                <option>문 앞에 놓아주세요.</option>
                <option>벨을 눌러주세요.</option>
                <option>배송 전에 연락주세요.</option>
            </select>
        </div>
    </section>

    <!-- 쿠폰 -->
    <section class="payments-section">
        <h2>쿠폰 및 할인</h2>

        <div class="coupon-box">
            <div>
                <strong>보유 쿠폰</strong>
                <p>사용 가능한 쿠폰을 선택해주세요.</p>
            </div>
            <button type="button" class="coupon-btn">쿠폰 선택</button>
        </div>
    </section>

    <!-- 결제 수단 -->
    <section class="payments-section">
        <h2>결제 수단</h2>

        <div class="payments-methods">
            <label class="method-item">
                <input type="radio" name="payment" value="card" checked>
                <span>신용 / 체크카드</span>
            </label>

            <label class="method-item">
                <input type="radio" name="payment" value="kakao">
                <span>카카오페이</span>
            </label>

            <label class="method-item">
                <input type="radio" name="payment" value="naver">
                <span>네이버페이</span>
            </label>

            <label class="method-item">
                <input type="radio" name="payment" value="cash">
                <span>현장 결제</span>
            </label>
        </div>
    </section>

    <!-- 결제 금액 -->
    <section class="payments-section price-section">
        <h2>결제 금액</h2>

        <div class="price-row">
            <span>상품 금액</span>
            <strong>12,000원</strong>
        </div>

        <div class="price-row">
            <span>배달비</span>
            <strong>3,000원</strong>
        </div>

        <div class="price-row discount">
            <span>할인 금액</span>
            <strong>- 0원</strong>
        </div>

        <div class="total-price">
            <span>최종 결제 금액</span>
            <strong>15,000원</strong>
        </div>
    </section>

    <!-- 약관 동의 -->
    <section class="payments-section agreement-section">
        <label class="agreement-all">
            <input type="checkbox" id="agreeAll">
            <strong>전체 약관에 동의합니다.</strong>
        </label>

        <div class="agreement-item">
            <label>
                <input type="checkbox" class="agree-check">
                주문 상품 및 결제 내용을 확인하였습니다.
            </label>
        </div>

        <div class="agreement-item">
            <label>
                <input type="checkbox" class="agree-check">
                개인정보 수집 및 이용에 동의합니다.
            </label>
        </div>
    </section>

    <!-- 하단 결제 버튼 -->
    <footer class="payments-footer">
        <div class="footer-price">
            <span>최종 결제 금액</span>
            <strong>15,000원</strong>
        </div>

<button
    type="button"
    class="pay-btn"
    onclick="completePayment()"
>
    15,000원 결제하기
</button>
    </footer>

</div>

<script>
    const agreeAll = document.querySelector("#agreeAll");
    const agreeChecks = document.querySelectorAll(".agree-check");

    agreeAll.addEventListener("change", function () {
        agreeChecks.forEach(check => {
            check.checked = agreeAll.checked;
        });
    });

    agreeChecks.forEach(check => {
        check.addEventListener("change", function () {
            agreeAll.checked = [...agreeChecks].every(item => item.checked);
        });
    });
    
</script>

</body>
</html>
